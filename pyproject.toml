[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cam-streamer"
version = "0.1.0"
description = "Stream webcams from a Linux host into SiMa Insight RTSP source slots from a terminal UI"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
dependencies = [
    "click>=8.0,<9.0",
    "textual>=3.7,<4",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
]

[project.scripts]
cam-streamer = "cam_streamer.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["cam_streamer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
